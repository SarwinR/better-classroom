name: Build extension release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

      stores:
        description: Automatically submit the release to stores
        required: true
        default: none
        type: choice
        options: [none, both, chrome, edge]

permissions:
  contents: read

concurrency:
  group: extension-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: v${{ steps.version.outputs.value }}
    permissions:
      contents: write
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check selected store configuration
        env:
          STORES: ${{ inputs.stores }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          case "$STORES" in
            none) ;;
            chrome|edge) node scripts/publish-store.mjs "$STORES" --check-config ;;
            both)
              node scripts/publish-store.mjs chrome --check-config
              node scripts/publish-store.mjs edge --check-config
              ;;
            *) exit 1 ;;
          esac

      - name: Run regression tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Ensure main has not moved
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Bump manifest version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION="$(node scripts/release-tools.mjs bump "$BUMP")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate and package extension
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir dist
          node scripts/release-tools.mjs validate
          node scripts/release-tools.mjs package "dist/better-classroom-v$VERSION.zip"
          unzip -t "dist/better-classroom-v$VERSION.zip"
          test "$(unzip -Z1 "dist/better-classroom-v$VERSION.zip" | grep -c '^manifest.json$')" = "1"

      - name: Preserve release package
        uses: actions/upload-artifact@v4
        with:
          name: better-classroom-v${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit and tag version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" "dist/better-classroom-v$VERSION.zip" --generate-notes --title "v$VERSION"

  publish:
    needs: release
    if: inputs.stores != 'none'
    uses: ./.github/workflows/publish-stores.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      stores: ${{ inputs.stores }}
    secrets:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
